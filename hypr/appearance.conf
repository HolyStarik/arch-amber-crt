# Amber CRT appearance layer for Hyprland.
$mod = SUPER

monitor = , preferred, auto, 1

exec-once = swaybg -i ~/.config/arch-amber-crt/assets/amber-grid.svg -m fill
exec-once = waybar
exec-once = cool-retro-term --fullscreen -e bash -lc 'exec "$HOME/.config/arch-amber-crt/scripts/bitcoin-splash.sh"'

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(e8a34aff)
    col.inactive_border = rgba(4b3624ff)
    layout = dwindle
}

decoration {
    rounding = 2
    active_opacity = 0.96
    inactive_opacity = 0.91
    blur {
        enabled = true
        size = 4
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(000000aa)
    }
}

animations {
    enabled = true
    bezier = crt, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, crt, popin 85%
    animation = windowsOut, 1, 3, crt, popin 85%
    animation = border, 1, 4, crt
    animation = fade, 1, 3, crt
    animation = workspaces, 1, 3, crt, slide
}

$terminal = cool-retro-term
$menu = wofi --show drun
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod, M, exit
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5